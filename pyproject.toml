[project]
name = "statsbombplot"
version = "0.1.0"
description = "Football analytics visualizations built on StatsBomb open data."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=11.0",
    "requests>=2.32",
    "statsbombpy>=1.16",
    "tqdm>=4.66",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # long docstrings/strings; the formatter handles code

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
